# Versions, kept by changesets.
#
# On `main`, while changesets remain, a "chore: release" PR bumps the
# version and writes CHANGELOG.md. Once merged, none remain: the version is
# tagged `vX.Y.Z`, then the binaries and extensions are built and published.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  changesets:
    name: Changesets
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      # A PR opened with GITHUB_TOKEN triggers no workflow, its CI never
      # runs: the release PR is opened by the repository's GitHub App.
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # `release:version` updates Cargo.lock.
      - uses: dtolnay/rust-toolchain@1.88
      - run: npm ci
      - id: changesets
        uses: changesets/action@v1
        # Through the API, the release commit is signed by GitHub: `main`
        # requires signed commits.
        with:
          version: npm run release:version
          commit: "chore: release"
          title: "chore: release"
          commitMode: github-api
          github-token: ${{ steps.app.outputs.token }}
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  tag:
    name: Tag
    needs: changesets
    if: needs.changesets.outputs.pending == 'false'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.tag.outputs.created }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        name: Tag the version if it is new
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version already exists"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "v$version"
            git push origin "v$version"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  # A tag pushed with GITHUB_TOKEN triggers no workflow: the build is called
  # directly.
  build:
    name: Build
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: v${{ needs.tag.outputs.version }}
      publish: true
    secrets: inherit

  # Trusted publishing (OIDC), no stored token: both stores' policies name
  # this file, which is why the job lives here and not in build.yml.
  stores:
    name: Marketplace and Open VSX
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Open VSX trusts a workflow only once the extension has a version: the
      # first one goes out with this token, which can be deleted afterwards.
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: papyrus-*
          path: dist
          merge-multiple: true
      # `--skip-duplicate`: a run started again publishes what is missing.
      # The platforms only: with the universal package, the Marketplace kept
      # it alone (0.16.2) and every platform installed it, binary-less.
      - name: Visual Studio Marketplace
        run: |
          platforms=$(ls dist/*.vsix | grep -v '/papyrus-toolchain-[0-9]')
          npx --yes @vscode/vsce@^4.1.0 publish --oidc --skip-duplicate --packagePath $platforms
      # Even when the Marketplace refuses: one store does not wait on the other.
      - name: Open VSX
        if: ${{ !cancelled() }}
        run: |
          auth=--trusted-publishing
          if [ -n "$OVSX_PAT" ]; then auth="--pat $OVSX_PAT"; fi
          for vsix in dist/*.vsix; do
            npx --yes ovsx@^1.3.0 publish "$vsix" $auth --skip-duplicate
          done
