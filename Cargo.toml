[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wk/papyrus-tools"

[workspace.dependencies]
papyrus-dialect = { path = "crates/papyrus-dialect", version = "0.2.0" }
papyrus-syntax = { path = "crates/papyrus-syntax", version = "0.2.0" }
papyrus-project = { path = "crates/papyrus-project", version = "0.2.0" }
papyrus-fmt = { path = "crates/papyrus-fmt", version = "0.2.0" }
papyrus-lint = { path = "crates/papyrus-lint", version = "0.2.0" }
papyrus-stdlib = { path = "crates/papyrus-stdlib", version = "0.2.0" }

ariadne = "0.6"
clap = { version = "4.6", features = ["derive"] }
encoding_rs = "0.8"
logos = "0.16"
rowan = "0.17"
serde = { version = "1", features = ["derive"] }
text-size = "1.1"
toml = "1.1"

insta = "1.48"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
