[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.11.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/kiyozz/papyrus-tools"

[workspace.dependencies]
papyrus-dialect = { path = "crates/papyrus-dialect", version = "0.11.1" }
papyrus-syntax = { path = "crates/papyrus-syntax", version = "0.11.1" }
papyrus-project = { path = "crates/papyrus-project", version = "0.11.1" }
papyrus-fmt = { path = "crates/papyrus-fmt", version = "0.11.1" }
papyrus-lint = { path = "crates/papyrus-lint", version = "0.11.1" }
papyrus-stdlib = { path = "crates/papyrus-stdlib", version = "0.11.1" }
papyrus-lsp = { path = "crates/papyrus-lsp", version = "0.11.1" }
papyrus-hir = { path = "crates/papyrus-hir", version = "0.11.1" }
papyrus-build = { path = "crates/papyrus-build", version = "0.11.1" }

ariadne = "0.6"
clap = { version = "4.6", features = ["derive"] }
encoding_rs = "0.8"
line-index = "0.1"
logos = "0.16"
rowan = "0.17"
salsa = "0.28.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
text-size = "1.1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
toml = "1.1"
toml_edit = "0.25"
tower-lsp-server = "0.23"

insta = "1.48"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
